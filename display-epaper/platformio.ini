; Pebble screen-time board on a LilyGO T5 V2.3.1 2.13" e-paper (same board as the alarm clock)
[env:t5]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
board_build.f_cpu = 80000000L
lib_deps =
    zinggjm/GxEPD2@^1.6.0
    olikraus/U8g2_for_Adafruit_GFX@^1.8.0
    bblanchon/ArduinoJson@^7.2.0
; Panel driver, as for the alarm clock. If the picture is garbled or mirrored, try
; GxEPD2_213_B74 (GDEM0213B74) or GxEPD2_213_B73 (GDEH0213B73).
build_flags =
    -DEPD_DRIVER=GxEPD2_213_BN
    -DCORE_DEBUG_LEVEL=0
